<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Job Tracker AI</title>
</head>
<body>

<nav class="navbar">
    <a href="{{ url_for('home') }}" class="navbar-brand">Pursuit</a>
    <a href="{{ url_for('dashboard') }}" class="navbar-link">Dashboard</a>
    <a href="{{ url_for('applications') }}" class="navbar-link">Applications</a>
    <a href="#" class="navbar-link">AI Match Scoring</a>
    <div class="navbar-spacer"></div>
    
    {% if logged_in %}
    <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
    <a href="{{ url_for('auth', mode='login') }}">Log in</a>
    {% endif %}
</nav>

{% block content %}
{% endblock %}

</body>
</html>
