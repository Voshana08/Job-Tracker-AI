<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
  <style>
    :root{
      --paper: oklch(0.95 0.014 85); --paper-raised: oklch(0.985 0.008 85);
      --ink: oklch(0.24 0.02 75); --ink-soft: oklch(0.48 0.02 75); --ink-faint: oklch(0.64 0.015 75);
      --line: oklch(0.82 0.018 80); --line-strong: oklch(0.68 0.02 80);
      --forest: oklch(0.36 0.08 155); --forest-deep: oklch(0.26 0.07 155);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,sans-serif;}
    a{color:var(--forest-deep);} a:hover{color:var(--forest);}
    .eyebrow{font-family:'Special Elite','Courier New',monospace;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);}
    .serif{font-family:'Newsreader',Georgia,serif;}
    .mono{font-family:'Special Elite','Courier New',monospace;}
    .field-line{width:100%;border:none;border-bottom:1.5px solid var(--line-strong);background:transparent;font-family:'IBM Plex Sans',sans-serif;font-size:16px;padding:8px 2px;color:var(--ink);outline:none;}
    .field-line::placeholder{color:var(--ink-faint);}
    .btn-stamp{width:100%;background:var(--forest);color:var(--paper-raised);font-weight:600;font-size:15px;padding:14px;border:1.5px solid var(--forest-deep);border-radius:3px;box-shadow:2px 2px 0 var(--forest-deep);}
  </style>
</helmet>

<div style="width:1000px;height:900px;background:var(--paper);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">

  <!-- watermark stamp -->
  
  

  <div style="width: 611px; background: var(--paper-raised); border: 1.5px solid var(--ink); border-radius: 2px; padding: 44px 40px; position: relative; box-shadow: 0 30px 60px -28px oklch(0.24 0.02 75 / 0.4); height: 579px">
    

    <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:28px;">
      
      <span class="serif" style="font-size: 20px; font-style: normal; font-weight: 600">Pursuit</span>
    </div>

    
    <h1 class="serif" style="font-size:30px;font-weight:500;margin:0 0 8px;">Access your case file</h1>
    <p style="color:var(--ink-soft);font-size:14.5px;margin:0 0 26px;">Log in to see your application pipeline.</p>

    <div style="display:flex;gap:0;margin-bottom:30px;border-bottom:1.5px solid var(--line-strong);">
      <div style="padding:0 0 12px;margin-right:28px;border-bottom:2.5px solid var(--forest-deep);font-weight:600;font-size:14.5px;">Log in</div>
      <div style="padding:0 0 12px;color:var(--ink-faint);font-weight:600;font-size:14.5px;">Sign up</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:22px;margin-bottom:28px;">
      <div>
        <div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--ink-faint);margin-bottom:6px;">APPLICANT NAME</div>
        <input class="field-line" type="text" placeholder="AB21">
      </div>
      <div>
        <div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--ink-faint);margin-bottom:6px;">PASSCODE</div>
        <input class="field-line" type="password" placeholder="••••••••">
      </div>
    </div>

    <button class="btn-stamp">Enter →</button>

    
  </div>
</div>
</x-dc>
</body>
</html>
